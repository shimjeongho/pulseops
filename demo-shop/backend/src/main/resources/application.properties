spring.application.name=demo-shop-backend

# --- Datasource -------------------------------------------------------------
# Local development MySQL. Override per environment.
spring.datasource.url=jdbc:mysql://localhost:3306/demoshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=demoshop
spring.datasource.password=demoshop

# --- Flyway -----------------------------------------------------------------
# Flyway owns the schema. Migrations live in classpath:db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA --------------------------------------------------------------------
# ddl-auto is NOT used to generate schema. 'validate' makes Hibernate check that
# entities match the Flyway-managed schema and fail fast on divergence.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
