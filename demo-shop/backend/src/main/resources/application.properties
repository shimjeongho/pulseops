spring.application.name=demo-shop-backend

# --- Datasource -------------------------------------------------------------
# 로컬 개발용 MySQL이다. 환경별로 재정의한다.
spring.datasource.url=jdbc:mysql://localhost:3306/demoshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=demoshop
spring.datasource.password=demoshop

# --- Flyway -----------------------------------------------------------------
# Schema는 Flyway가 관리한다. Migration 파일은 classpath:db/migration에 둔다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA --------------------------------------------------------------------
# ddl-auto로 Schema를 생성하지 않는다. 'validate'는 Entity가 Flyway로 관리되는 Schema와
# 일치하는지 Hibernate가 확인하고 불일치하면 즉시 실패하게 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka Producer ---------------------------------------------------------
# Telemetry Event를 PulseOps로 보내는 Producer 설정이다. 환경별로 재정의한다.
spring.kafka.bootstrap-servers=localhost:9092

# Demo Shop과 PulseOps의 계약은 Java Class가 아니라 JSON 문자열이다. Key와 Value 모두 문자열로
# 보내 Consumer가 Demo Shop의 Class 구조나 Java Type Header에 묶이지 않게 한다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# send() 호출은 비동기여도 metadata 확보와 buffer 확보 단계에서 block될 수 있다. 기본값 60초를
# 그대로 두면 Broker 장애가 Demo Shop API 응답 시간으로 그대로 번지므로 짧게 제한한다.
spring.kafka.producer.properties.max.block.ms=500

# 관측 Event는 오래 붙잡고 재시도할 가치가 없다. 기본값(전달 120초, 요청 30초)보다 빨리 포기하고
# 실패를 log로 남긴다. delivery.timeout.ms는 linger.ms + request.timeout.ms 이상이어야 한다.
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

# --- Fault Injection --------------------------------------------------------
# 개발 및 Demo에서 PulseOps의 장애 탐지를 재현하기 위한 장애 주입 스위치이다. 기본값은 비활성이며
# 이 값이 true일 때만 X-Demo-Fault Header가 의미를 갖는다. Production 설정에서 켜지 않는다.
# Demo 실행 시에만 실행 인자로 덮어쓴다. 예: --demo-shop.fault-injection.enabled=true
demo-shop.fault-injection.enabled=false
