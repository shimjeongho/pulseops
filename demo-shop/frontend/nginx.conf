# Demo Shop Frontend를 서비스하고 /api 요청을 Demo Shop Backend로 넘긴다.
#
# 브라우저에게는 이 nginx 하나만 보인다. Frontend가 API 주소를 알지 못하고 /api/products처럼 상대
# 경로로만 호출하는 지금의 구조를 그대로 두려면, 같은 Origin에서 화면과 API가 모두 응답해야 한다.
# build 시점에 Backend 주소를 심는 방법도 있지만 그러면 주소마다 image를 다시 만들어야 하고, 브라우저에
# Container hostname을 알려 주는 방법은 Host에서 그 이름이 풀리지 않아 동작하지 않는다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker의 내장 DNS이다. upstream 이름을 변수로 두면 nginx가 시작할 때가 아니라 요청마다 이름을
    # 푼다. 고정 문자열로 두면 시작 시점에 한 번 푼 주소를 계속 쓰기 때문에, Backend Container를
    # 다시 띄워 IP가 바뀌면 이 nginx를 재시작할 때까지 502가 계속된다.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $demo_shop_backend "demo-shop-backend:8080";

        # proxy_pass에 경로를 붙이지 않아 원래 요청 URI가 그대로 전달된다. /api를 떼지 않는 이유는
        # Backend의 Route가 실제로 /api로 시작하기 때문이다.
        proxy_pass http://$demo_shop_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # React Router가 /orders/1 같은 경로를 화면 안에서 처리한다. 그 주소로 직접 들어오면 nginx는
        # 같은 이름의 파일을 찾지 못하므로, 파일이 없을 때 index.html을 돌려주어 Router가 경로를
        # 해석하게 한다. 이것이 없으면 새로고침 한 번에 404가 된다.
        try_files $uri $uri/ /index.html;
    }
}
