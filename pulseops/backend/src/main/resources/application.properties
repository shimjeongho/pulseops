spring.application.name=pulseops-backend

# --- Web --------------------------------------------------------------------
# Demo Shop Backend가 8080을 쓰므로 PulseOps는 8081로 분리한다. 관측 대상과 관측 Application은
# 개발 중에 항상 함께 떠 있어야 하고, 두 Application이 같은 Port를 기본값으로 두면 나중에 뜬
# 쪽이 기동에 실패한다.
server.port=8081

# --- Kafka Consumer ---------------------------------------------------------
# Demo Shop Telemetry Event를 받는 Consumer 설정이다. 환경별로 재정의한다.
spring.kafka.bootstrap-servers=localhost:9092

# Metric 집계를 담당할 Consumer의 group이다. Phase 2에서는 수신과 검증만 하지만 같은 역할에
# Metric 처리가 이어서 들어오므로 group을 따로 만들지 않는다. group을 나누면 offset이 갈라져
# 나중에 합칠 때 Event를 다시 읽거나 건너뛰게 된다.
spring.kafka.consumer.group-id=pulseops-metric-consumer-v1

# 새 group은 Demo Shop이 이미 발행해 둔 Event부터 읽는다. latest면 Consumer가 붙기 전 구간이
# 조용히 사라진다.
spring.kafka.consumer.auto-offset-reset=earliest

# 계약이 JSON 문자열이므로 value를 String으로 받아 Application 안에서 직접 역직렬화한다.
# Deserializer가 역직렬화하면 잘못된 payload를 Listener 안에서 log 후 넘기지 못한다.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Redis ------------------------------------------------------------------
# 실시간 Metric과 Operational State를 담을 Redis 연결이다. 환경별로 재정의한다.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis 응답을 기다리는 시간을 기본값보다 크게 줄인다. Metric 처리는 Kafka Consumer Thread
# 위에서 일어나므로, Redis가 응답하지 않을 때 Thread가 오래 묶이면 Consumer가 poll 주기를
# 넘겨 재할당을 반복하게 된다. Redis 장애 시 빠르게 포기하고 넘어가는 편이 Metric 한 건을
# 지키는 것보다 낫다.
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# --- Datasource -------------------------------------------------------------
# Incident처럼 영구 보존이 필요한 데이터를 담을 로컬 개발용 MySQL이다. 환경별로 재정의한다.
# Demo Shop과 다른 database를 쓴다. PulseOps는 Demo Shop의 Business Database에 접근하지 않는다.
#
# allowPublicKeyRetrieval은 MySQL 8.4의 기본 인증(caching_sha2_password)이 TLS 없는 로컬 연결에서
# 서버 공개키를 받아야 하기 때문에 필요하다. connectionTimeZone은 Hibernate를 거치지 않는 JDBC
# 접근까지 UTC로 고정한다. characterEncoding은 Connector/J 8부터 UTF-8이 기본이라 넣지 않는다.
spring.datasource.url=jdbc:mysql://localhost:3306/pulseops?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=pulseops
spring.datasource.password=pulseops

# --- Flyway -----------------------------------------------------------------
# Schema는 Flyway가 관리한다. Migration 파일은 classpath:db/migration에 둔다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA --------------------------------------------------------------------
# ddl-auto로 Schema를 생성하지 않는다. 'validate'는 Entity가 Flyway로 관리되는 Schema와
# 일치하는지 Hibernate가 확인하고 불일치하면 즉시 실패하게 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Metric 창 경계와 Incident의 시각은 전부 Instant이며 초 단위로 의미를 갖는다. 이 설정이 없으면
# Instant와 DATETIME 사이 변환이 JVM 시간대를 타서, 저장된 값이 환경마다 다른 시각을 뜻하게 된다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- AI Incident Analysis ---------------------------------------------------
# Claude에게 이미 만들어진 Incident의 사후 분석을 맡기는 기능이다. Incident를 탐지하거나 상태를
# 바꾸는 일에는 관여하지 않으며, 사람이 분석을 요청했을 때만 호출한다.
#
# 기본은 꺼짐이다. 이 Application이 외부에 요금이 발생하는 요청을 보내는 자리는 여기 하나뿐이고
# 나머지 기능은 전부 이것 없이 동작한다. 켜짐이 기본이면 credential이 없는 환경에서 기동과 테스트가
# 실패하거나, 아무도 의도하지 않은 요청이 나간다. 쓰려면 아래 셋을 모두 설정한다.
pulseops.ai.claude.enabled=false

# API key는 환경 변수에서만 온다. 실제 값을 이 파일에 적지 않는다. 여기 적힌 key는 그 순간 repository에
# 들어갈 수 있는 값이 되고, 한 번 들어가면 history에서 지울 수 없다.
pulseops.ai.claude.api-key=${ANTHROPIC_API_KEY:}

# 분석에 쓸 model이다. 코드에 박지 않는다. 쓸 수 있는 model은 시간이 지나면 바뀌고, 그때 코드를 고쳐
# 다시 배포해야 한다면 그것은 설정이어야 할 값이 코드에 있는 것이다.
pulseops.ai.claude.model=${CLAUDE_MODEL:}
