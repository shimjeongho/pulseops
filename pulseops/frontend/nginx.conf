# PulseOps Frontend를 서비스하고 /api 요청을 PulseOps Backend로 넘긴다.
#
# 브라우저에게는 이 nginx 하나만 보인다. Frontend가 API 주소를 알지 못하고 /api/metrics처럼 상대
# 경로로만 호출하는 지금의 구조를 그대로 두려면, 같은 Origin에서 화면과 API가 모두 응답해야 한다.

# 상태 변경 요청은 이 PC에서 직접 연 화면에서만 받는다. Tunnel 경유 외부 화면은 조회 전용이다.
#
# 앞단 Quick Tunnel과 이 PC의 브라우저는 모두 Host의 port mapping을 거쳐 들어오므로 $remote_addr가
# 같다(Docker bridge gateway). 그래서 IP가 아니라 요청이 가진 두 표시로 가른다.
# - Host: Tunnel은 방문자가 연 공개 hostname을 그대로 넘기고, 로컬은 127.0.0.1 또는 localhost이다.
# - CF-Connecting-IP / CF-Ray: Cloudflare edge가 모든 요청에 붙이며 방문자가 지울 수 없다.
# 두 표시가 모두 로컬을 가리킬 때만 받는다. 한쪽만 보면 Tunnel 구성이 바뀌는 순간 그 기준이 무력해진다.
# X-Forwarded-For는 쓰지 않는다. 방문자가 앞자리를 마음대로 채울 수 있다.
map "$request_method|$host|$http_cf_connecting_ip$http_cf_ray" $pulseops_write_rejected {
    default                                   1;
    "~^(GET|HEAD)\|"                          0;
    "~^[A-Z]+\|(127\.0\.0\.1|localhost)\|$"   0;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker의 내장 DNS이다. upstream 이름을 변수로 두면 nginx가 시작할 때가 아니라 요청마다 이름을
    # 푼다. 고정 문자열로 두면 시작 시점에 한 번 푼 주소를 계속 쓰기 때문에, Backend Container를
    # 다시 띄워 IP가 바뀌면 이 nginx를 재시작할 때까지 502가 계속된다.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Incident 변경 알림 연결이다. 일반 API와 나누는 이유는 이 응답이 끝나지 않기 때문이다.
    #
    # 기본 설정 그대로 두면 nginx가 응답을 모아 두었다가 한꺼번에 내보내므로, Backend가 보낸 Event가
    # 브라우저에 곧바로 도착하지 않는다. 알림이 늦게 도착하는 것은 알림이 없는 것과 화면에서 구분되지
    # 않는다. 그리고 응답이 오래 열려 있는 것이 정상이므로, 읽기 대기 시간이 짧으면 nginx가 멀쩡한
    # 연결을 스스로 끊는다.
    location = /api/incidents/stream {
        set $pulseops_backend "pulseops-backend:8081";
        proxy_pass http://$pulseops_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE는 Backend가 보낸 조각을 그때그때 흘려보내야 한다.
        proxy_buffering off;
        proxy_cache off;

        # Backend는 Event를 20초마다 보내고 연결을 5분에 한 번 스스로 닫는다. 여기서 그보다 먼저
        # 끊으면 연결을 정리하는 주체가 Backend가 아니라 이 Proxy가 되어, 서버가 정한 수명이 뜻을
        # 잃는다. 넉넉하게 두어 언제나 Backend가 먼저 닫게 한다.
        proxy_read_timeout 10m;
    }

    location /api/ {
        # 외부 상태 변경 요청은 READ_ONLY_ACCESS로 거절한다. 기준은 위 map에 있다. Frontend의 ApiError가
        # 그대로 읽도록 Backend ErrorResponse와 같은 모양으로 돌려준다. default_type은 이 return의 본문에만
        # 쓰이며 Backend 응답의 Content-Type을 덮지 않는다.
        default_type application/json;

        if ($pulseops_write_rejected) {
            return 403 '{"status":403,"code":"READ_ONLY_ACCESS","message":"외부 공개 화면은 조회 전용입니다."}';
        }

        set $pulseops_backend "pulseops-backend:8081";

        # proxy_pass에 경로를 붙이지 않아 원래 요청 URI가 그대로 전달된다.
        proxy_pass http://$pulseops_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # React Router가 /incidents/1 같은 경로를 화면 안에서 처리한다. 파일이 없을 때 index.html을
        # 돌려주어야 그 주소로 직접 들어오거나 새로고침해도 화면이 열린다.
        try_files $uri $uri/ /index.html;
    }
}
