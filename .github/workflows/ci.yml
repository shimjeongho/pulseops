# Pull Request와 main push에서 repository의 품질을 자동으로 확인한다.
#
# 이 workflow는 배포하지 않는다. image를 registry로 밀지 않고, Release도 tag도 만들지 않으며, 어떤
# 환경에도 무언가를 올리지 않는다. 하는 일은 "지금 이 상태가 빌드되고 테스트를 통과하는가"뿐이다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 읽기만 하면 되는 workflow이다. 코드를 checkout하는 것 말고는 repository에 아무것도 쓰지 않으므로
# 기본 권한을 그대로 두지 않고 최소로 좁힌다.
permissions:
  contents: read

# 같은 branch에 새 commit이 올라오면 이전 실행을 취소한다. 이미 뒤처진 commit을 끝까지 검증하는 것은
# runner 시간만 쓰고 아무도 그 결과를 보지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    # 두 Backend를 같은 runner에서 잇달아 돌리지 않고 project마다 runner를 따로 쓴다. 두 project의
    # Integration Test는 모두 Testcontainers로 MySQL, Redis, Kafka를 직접 띄우기 때문에, 한 runner에
    # 몰면 Container가 겹쳐 memory 때문에 실패하고 그 실패는 코드의 문제가 아니다. 나누면 실패가 어느
    # project의 것인지도 job 이름에서 바로 보인다.
    name: backend (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # 한쪽이 실패해도 다른 쪽을 끝까지 돌린다. 둘 다 봐야 무엇을 고쳐야 하는지 한 번에 알 수 있다.
      fail-fast: false
      matrix:
        project: [demo-shop, pulseops]

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # build.gradle.kts의 toolchain과 같은 값이다.
          java-version: '21'
          distribution: temurin
          # Gradle 배포본과 dependency를 runner 사이에서 재사용한다. Gradle을 따로 설치하지 않고
          # repository의 Wrapper를 그대로 쓴다.
          cache: gradle

      - name: Test
        working-directory: ${{ matrix.project }}/backend
        # Testcontainers는 runner에 이미 있는 Docker를 쓴다. MySQL, Redis, Kafka를 workflow의 service
        # container로 따로 띄우지 않는다. 그렇게 하면 테스트가 직접 관리하는 Container와 두 벌이 되어,
        # 테스트가 어느 쪽에 붙었는지 알 수 없게 된다.
        #
        # gradlew를 직접 실행하지 않고 sh에 넘긴다. 이 repository의 gradlew는 실행 권한 bit 없이
        # (100644) 기록되어 있어 Linux runner에서 ./gradlew가 Permission denied로 끝난다. gradlew는
        # POSIX sh script이므로 이렇게 부르면 권한과 무관하게 동작한다. Dockerfile도 같은 이유로
        # 같은 방식을 쓴다.
        run: sh gradlew --no-daemon --console=plain test

  frontend:
    name: frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [demo-shop, pulseops]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # 로컬 개발에서 쓰는 것과 같은 major이다.
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/frontend/package-lock.json

      - name: Install
        working-directory: ${{ matrix.project }}/frontend
        # install이 아니라 ci를 쓴다. lock 파일에 적힌 version만 설치하고 lock 파일을 고치지 않으므로,
        # CI가 개발자의 로컬과 다른 dependency로 통과하는 일이 생기지 않는다.
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.project }}/frontend
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.project }}/frontend
        run: npm run build

  docker:
    # image가 실제로 만들어지는지와 Compose 정의가 말이 되는지만 본다. 전체 stack을 띄우지는 않는다.
    # Kafka, MySQL, Redis, Prometheus, Grafana와 Application 넷을 매 Pull Request마다 올리는 것은
    # 시간과 자원을 크게 쓰면서, 여기서 새로 잡히는 문제는 로컬 검증에서 이미 잡히는 것과 같다.
    name: docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose file
        # 참조하는 파일 경로, service 사이의 의존 관계, 환경 변수 치환이 모두 풀리는지 확인한다.
        # 값은 전부 기본값이 있으므로 .env 없이도 통과해야 한다. secret을 요구하지 않는다.
        run: docker compose config --quiet

      - name: Build images
        # 네 Application image를 모두 만든다. registry로 밀지 않으므로 tag는 Compose가 붙이는 이름을
        # 그대로 쓴다.
        run: docker compose build
